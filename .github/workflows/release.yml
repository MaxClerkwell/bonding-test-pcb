name: JLCPCB production data

# A tag such as v1.0.0 builds the Gerber data and publishes it as a release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      BOARD: bonding_test.kicad_pcb
      NAME: bonding-test-pcb-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - name: DRC and Gerber export (KiCad 10)
        run: |
          docker run --rm --user root -v "$PWD":/work -w /work kicad/kicad:10.0 sh -euc '
            kicad-cli pcb drc --severity-error --exit-code-violations -o drc.rpt "$0"
            mkdir -p out
            kicad-cli pcb export gerbers \
              --layers F.Cu,F.Mask,F.SilkS,B.Cu,B.Mask,B.SilkS,Edge.Cuts \
              --no-x2 --no-netlist --subtract-soldermask \
              -o out/ "$0"
            kicad-cli pcb export drill --format excellon --excellon-units mm \
              --excellon-separate-th -o out/ "$0"
          ' "$BOARD"
          sudo chown -R "$(id -u):$(id -g)" out drc.rpt

      - name: ZIP for the JLCPCB upload
        run: |
          rm -f out/*.gbrjob
          ls -l out
          (cd out && zip -9 "../$NAME-jlcpcb.zip" *)

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$NAME-jlcpcb.zip" \
            --title "$GITHUB_REF_NAME" \
            --notes "Gerber data for JLCPCB (order as 2 layers so the back-side silkscreen is printed; the back copper is empty). Surface finish: ENIG."
